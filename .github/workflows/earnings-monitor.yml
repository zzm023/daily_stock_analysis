name: 季报追踪·财报日程+恶化预警

on:
  schedule:
    - cron: '45 8 * * 1-5'   # 收盘后 16:45 北京时间
  workflow_dispatch:

jobs:
  earnings-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install tushare requests

      - name: 运行季报追踪
        run: python earnings_monitor.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
