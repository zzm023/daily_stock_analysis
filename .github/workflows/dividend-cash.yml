name: 股息收租·日历+现金流

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 收盘后 17:00 北京时间
  workflow_dispatch:

jobs:
  dividend-cash:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install tushare requests

      - name: 运行股息收租
        run: python dividend_cash.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
