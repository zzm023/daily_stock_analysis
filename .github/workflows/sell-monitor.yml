name: 卖出决策·翻倍+回本+恶化

on:
  schedule:
    - cron: '30 8 * * 1-5'   # 收盘后 16:30 北京时间
  workflow_dispatch:

jobs:
  sell-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行卖出决策
        run: python sell_monitor.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
