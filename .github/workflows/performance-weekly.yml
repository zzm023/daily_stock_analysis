name: 业绩归因周报

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-labs
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 业绩归因周报
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
        run: python performance_report.py
