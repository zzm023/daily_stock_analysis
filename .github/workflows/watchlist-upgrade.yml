name: 观察清单升级

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  watchlist-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 观察清单升级
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
        run: python watchlist_upgrade.py
      - name: 提交分类
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add framework_state.json
          git diff --staged --quiet || git commit -m "🏷️ 自动分类 ⑥⑦⑧ [skip ci]"
          git push
