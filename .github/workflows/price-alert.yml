name: 价格异动监控·持仓±3%+观察±5%

on:
  schedule:
    - cron: '*/10 1-7 * * 1-5'   # 交易时段每10分钟（脚本内再判断精确时段）
  workflow_dispatch:

jobs:
  price-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行价格异动监控
        run: python price_alert.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}

      - name: 提交状态文件（跨次去重）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "价格异动状态更新"
          file_pattern: price_alert_state.json
