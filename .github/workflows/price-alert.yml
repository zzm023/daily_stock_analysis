name: 价格异动监控

on:
  schedule:
    - cron: '*/10 1-3,5-7 * * 1-5'   # UTC 1-3点、5-7点，每10分钟（北京 9-11、13-15）
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 价格异动
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
        run: python price_alert.py
      - name: 保存提醒状态
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "价格异动状态更新"
          file_pattern: price_alert_state.json
